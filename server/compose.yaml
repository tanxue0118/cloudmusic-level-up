services:
  netease-autoplay:
    build: .
    restart: unless-stopped
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      PHP_CLI_SERVER_WORKERS: "4"
    volumes:
      - ./state:/app/state
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS --max-time 3 http://127.0.0.1:8080/ | grep -q '网易云自动刷歌'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
